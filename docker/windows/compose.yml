# Applied after the checkout's docker-compose.yml by control.sh.
services:
    postgres:
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U zotonic -d zotonic"]
            interval: 2s
            timeout: 5s
            retries: 30

    zotonic:
        # Forward shutdown signals to the foreground Erlang process as well as
        # its shell launcher. Interactive development shells keep their defaults.
        entrypoint: ["/usr/bin/dumb-init", "--", "/opt/zotonic-docker/docker-entrypoint.sh"]
        command: ["start_nodaemon"]
        depends_on:
            postgres:
                condition: service_healthy
        stop_grace_period: 60s
        # docker exec must use the same paths as the entrypoint's server process.
        environment:
            HOME: /opt/zotonic
            ZOTONIC_CONFIG_DIR: /opt/zotonic/docker-data/config
            ZOTONIC_SECURITY_DIR: /opt/zotonic/docker-data/security
            ZOTONIC_DATA_DIR: /opt/zotonic/docker-data/data
            ZOTONIC_LOG_DIR: /opt/zotonic/docker-data/logs
            ZOTONIC_PIDFILE: /run/zotonic.pid
