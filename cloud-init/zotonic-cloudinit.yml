#cloud-config
# Zotonic on Ubuntu 24.04 and 26.04 LTS.
#
# Example configs here:
# https://cloudinit.readthedocs.io/en/latest/topics/examples.html
#
# Add groups to the system
groups:
  - ubuntu: [root,sys]

# Add users to the system. Users are added after groups are added.
users:
  - default
  - name: zotonic
    gecos: Zotonic
    sudo: null
    lock_passwd: true
    shell: /bin/bash
    # ssh_authorized_keys:
    #   - <ssh pub key 1>
    #   - <ssh pub key 2>

package_update: true

packages:
  - build-essential
  - libseccomp-dev
  - libcap2-bin
  - libssl-dev
  - automake
  - autoconf
  - libncurses-dev
  - zlib1g-dev
  - git
  - postgresql
  - postgresql-client
  - curl
  - ca-certificates
  - python3
  - gettext
  - inotify-tools
  - libnotify-bin
  - clamav
  - clamav-daemon
  - ghostscript
  - file
  - imagemagick
  - ffmpeg
  # wkhtmltopdf is available on Ubuntu 24.04, but is no longer packaged for
  # Ubuntu 26.04. Its upstream builds need separate compatibility testing.
  # xvfb, previously used with wkhtmltopdf, is also omitted.

bootcmd:
  # Ensure the ClamAV socket override directory exists before write_files runs.
  - [mkdir, -p, /etc/systemd/system/clamav-daemon.socket.d]

write_files:
  # Keep ClamAV local to the host and restrict the Unix socket to its group.
  - path: /etc/systemd/system/clamav-daemon.socket.d/listen.conf
    owner: root:root
    permissions: '0644'
    content: |
      [Socket]
      ListenStream=
      ListenStream=/run/clamav/clamd.ctl
      SocketUser=clamav
      SocketGroup=clamav
      SocketMode=0660

runcmd:
  # Stop provisioning on failure, before attempting to start Zotonic.
  - set -e
  # Use kerl to install a good and recent version of Erlang
  - curl -fL -O https://raw.githubusercontent.com/kerl/kerl/master/kerl
  - chmod a+x kerl
  - mv kerl /usr/local/bin/kerl
  - mkdir -p /usr/local/lib/erlang
  - /usr/local/bin/kerl update releases
  - /usr/local/bin/kerl build 28.5
  - /usr/local/bin/kerl install 28.5 /usr/local/lib/erlang/28.5
  - echo ". /usr/local/lib/erlang/28.5/activate" >> /etc/profile
  - echo "export REBAR_CACHE_DIR=~/.cache/rebar3" >> /etc/profile
  # Allow Erlang (beam.smp) to listen on restricted ports (below 1024)
  - setcap 'cap_net_bind_service=+ep' /usr/local/lib/erlang/28.5/erts-*/bin/beam.smp
  # Restrict epmd listen IP addresses
  - echo "ERL_EPMD_ADDRESS=127.0.0.1,127.0.1.1" >> /etc/environment
  # PostgreSQL uses peer authentication on its local socket, so the database
  # role matches the Zotonic OS user and does not need a password.
  - sudo --user=postgres -- psql -c "CREATE USER zotonic;"
  - sudo --user=postgres -- psql -c "CREATE DATABASE zotonic WITH OWNER = zotonic ENCODING = 'UTF8';"
  - sudo --user=postgres -- psql -c "GRANT ALL ON DATABASE zotonic TO zotonic;"
  - sudo --user=zotonic -- psql --host=/run/postgresql --dbname=zotonic --no-password --command='SELECT 1;'
  # Set ulimit file handles
  - echo "zotonic   soft   nofile   60000" > /etc/security/limits.d/zotonic.conf
  - echo "zotonic   hard   nofile   60000" >> /etc/security/limits.d/zotonic.conf
  # Max inotify files setting
  - echo "fs.inotify.max_user_watches=10000" > /etc/sysctl.d/40-max-user-watches.conf
  - sysctl -p /etc/sysctl.d/40-max-user-watches.conf
  # Ubuntu 24.04 ships ImageMagick 6 and Ubuntu 26.04 ships ImageMagick 7.
  # Allow PDF reading for previews while retaining the other restrictions.
  - |
    if [ -f /etc/ImageMagick-7/policy.xml ]; then
        imagemagick_policy=/etc/ImageMagick-7/policy.xml
    elif [ -f /etc/ImageMagick-6/policy.xml ]; then
        imagemagick_policy=/etc/ImageMagick-6/policy.xml
    else
        echo "ImageMagick policy.xml not found" >&2
        exit 1
    fi
    sed -i '/<\/policymap>/i\  <policy domain="coder" rights="read" pattern="PDF" />' "$imagemagick_policy"
  # Let Zotonic access ClamAV's local socket. Stop socket activation too, so
  # it cannot restart clamd while the socket configuration is being changed.
  - usermod --append --groups clamav zotonic
  - systemctl stop clamav-daemon.service clamav-daemon.socket clamav-freshclam.service
  - |
    sed -i -E '/^[[:space:]]*(TCPSocket|TCPAddr|LocalSocket|LocalSocketGroup|LocalSocketMode)[[:space:]]/d' /etc/clamav/clamd.conf
    printf '\n# Zotonic local scanner\nLocalSocket /run/clamav/clamd.ctl\nLocalSocketGroup clamav\nLocalSocketMode 660\n' >> /etc/clamav/clamd.conf
  - freshclam
  - systemctl daemon-reload
  - systemctl enable --now clamav-freshclam.service clamav-daemon.socket clamav-daemon.service
  # Wait for signatures to load and verify the protocol, not just an open port.
  - |
    sudo --user=zotonic -- python3 - <<'PY'
    import socket
    import time

    deadline = time.monotonic() + 120
    while time.monotonic() < deadline:
        try:
            with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as scanner:
                scanner.settimeout(2)
                scanner.connect('/run/clamav/clamd.ctl')
                scanner.sendall(b'nPING\n')
                with scanner.makefile('rb') as response:
                    if response.readline(32).strip() == b'PONG':
                        break
        except OSError:
            pass
        time.sleep(1)
    else:
        raise SystemExit('ClamAV did not respond on /run/clamav/clamd.ctl within 120 seconds')
    PY
  # Generate ssh key for git urls
  - sudo su zotonic -l -c "mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh-keygen -q -f ~/.ssh/id_rsa -N ''"
  # Zotonic installation
  - sudo su zotonic -l -c "git clone 'https://github.com/zotonic/zotonic'"
  - sudo su zotonic -l -c "mkdir -p .config/zotonic/config/1/config.d"
  - sudo su zotonic -l -c "cp zotonic/cloud-init/config.d/* .config/zotonic/config/1/config.d/."
  - sudo su zotonic -l -c "cd zotonic; make"
  - sudo su zotonic -l -c "cd zotonic; bin/zotonic start"
