# Configure all ports
# Low ports are enabled with setcap in zotonic-cloudinit.yml.
# Copy this file to ~/.config/zotonic/config/1/config.d/ports.yml.
zotonic:
    # IP addresses to listen on
    listen_ip: any
    listen_ip6: any
    # Outside ports
    port: 80
    ssl_port: 443
    # HTTP port, opened directly due to using setcap
    listen_port: 80
    # HTTPS port, opened directly due to using setcap
    ssl_listen_port: 443
    # Let SMTP listen on all IP addresses
    smtp_listen_ip: any
    # SMTP ports, opened directly due to using setcap
    smtp_listen_port: 25
    # MQTT ports, opened directly
    mqtt_listen_port: 1883
    mqtt_listen_ssl_port: 8883
    # Connect to PostgreSQL through /run/postgresql/.s.PGSQL.5432.
    dbhost: socket
    dbport: 5432
    # Scan uploads over ClamAV's default Unix socket, without TCP fallback.
    clamav_ip: socket
    clamav_max_size: 26214400
