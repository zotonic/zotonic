# Publish a new version of Zotonic to Hex
# Needs a HEX_API_KEY in the GH secrets of the project or org.

name: Publish

# Start if a release is published or manually
on:
  release:
    types: [published]

  workflow_dispatch:

# Publish a new version IFF the tests and xref are passing
jobs:
  linux:
    name: Publish ${{ github.ref }} to Hex ${{ matrix.otp_version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        otp_version: [28.5]
        os: [ubuntu-latest]

    container:
      image: erlang:${{ matrix.otp_version }}

    # Start PostgreSQL wth 'zotonic' as the default user.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zotonic
          POSTGRES_USER: zotonic
          POSTGRES_PASSWORD: zotonic
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Add user Zotonic
        run: |
          apt-get update
          apt-get -y install sudo
          adduser --disabled-login zotonic
      - name: Compile
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publishing is only allowed from an exact release tag."
            exit 1
          fi
          if [ "$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION does not match release tag $GITHUB_REF_NAME."
            echo "Run release/prepare-release.sh before committing and tagging the release."
            exit 1
          fi
          make
      - name: Test
        run: |
          ZOTONIC_DBHOST=postgres bin/zotonic connectdb
          chown -R zotonic .
          sudo -u zotonic bash -c "ZOTONIC_DBHOST=postgres bin/zotonic runtests"
      - name: XRef
        run: make xref
      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mkdir -p ~/.config/rebar3
          echo '{plugins, [rebar3_hex]}.' > ~/.config/rebar3/rebar.config
          ./rebar3 plugins upgrade --all
          ./rebar3 plugins list
          release/hex-publish.sh
