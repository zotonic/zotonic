# Run tests

name: Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  linux:
    name: Test on OTP ${{ matrix.otp_version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        otp_version: [26, 27, 28.5]
        os: [ubuntu-latest]

    container:
      image: erlang:${{ matrix.otp_version }}

    # Start PostgreSQL wth 'zotonic' as the default user.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zotonic
          POSTGRES_USER: zotonic
          POSTGRES_PASSWORD: zotonic
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies and add user Zotonic
        run: |
          apt-get update
          apt-get -y install sudo libseccomp-dev imagemagick ghostscript ffmpeg file
          adduser --disabled-login zotonic
      - name: Compile
        run: make
      - name: Test
        run: |
          ZOTONIC_DBHOST=postgres bin/zotonic connectdb
          chown -R zotonic .
          # erlexec uses SHELL; the disabled-login account has a non-login shell.
          sudo -u zotonic env SHELL=/bin/sh ZOTONIC_DBHOST=postgres bin/zotonic runtests
      - name: XRef
        run: make xref
      - name: Sandbox integration tests
        run: |
          cc -Wall -Wextra -Werror -o /tmp/zotonic-sandbox-probe apps/zotonic_core/test/sandbox_probe.c
          cp /tmp/zotonic-sandbox-probe /usr/lib/zotonic-sandbox-denied-probe
          erlc -o /tmp apps/zotonic_core/test/z_exec_tests.erl apps/zotonic_core/test/z_media_preview_sandbox_tests.erl
          sudo -u zotonic env SHELL=/bin/sh ZOTONIC_SANDBOX_TESTS=1 ZOTONIC_SANDBOX_PROBE=/tmp/zotonic-sandbox-probe \
            ZOTONIC_SANDBOX_DENIED_EXEC=/usr/lib/zotonic-sandbox-denied-probe \
            erl -noshell -pa _build/default/lib/*/ebin /tmp \
            -eval 'case eunit:test([z_exec_tests, z_media_preview_sandbox_tests], [verbose]) of ok -> halt(0); _ -> halt(1) end.'
      - name: edocs
        run: make edocs
